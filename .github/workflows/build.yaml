name: "Build"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: arm64
            tool: aarch64-unknown-linux-musl
          - name: arm32
            tool: arm-unknown-linux-musleabi
          - name: arm32hf
            tool: arm-unknown-linux-musleabihf
          - name: arm32v7
            tool: armv7-unknown-linux-musleabi
          - name: arm32v7hf
            tool: armv7-unknown-linux-musleabihf
          - name: i586
            tool: i586-unknown-linux-musl
          - name: i686
            tool: i686-unknown-linux-musl
          - name: loong64
            tool: loongarch64-unknown-linux-musl
          - name: m68k
            tool: m68k-unknown-linux-musl
          - name: microblazeel
            tool: microblazeel-xilinx-linux-musl
          - name: microblaze
            tool: microblaze-xilinx-linux-musl
          - name: mips64el
            tool: mips64el-unknown-linux-musl
          - name: mips64
            tool: mips64-unknown-linux-musl
          - name: mips32el
            tool: mipsel-unknown-linux-musl
          - name: mips32elsf
            tool: mipsel-unknown-linux-muslsf
          - name: mips32
            tool: mips-unknown-linux-musl
          - name: mips32sf
            tool: mips-unknown-linux-muslsf
          - name: or1k
            tool: or1k-unknown-linux-musl
          - name: powerpc64le
            tool: powerpc64le-unknown-linux-musl
          - name: powerpc64
            tool: powerpc64-unknown-linux-musl
          - name: powerpcle
            tool: powerpcle-unknown-linux-musl
          - name: powerpc
            tool: powerpc-unknown-linux-musl
          - name: riscv32
            tool: riscv32-unknown-linux-musl
          - name: riscv64
            tool: riscv64-unknown-linux-musl
          - name: s390x
            tool: s390x-ibm-linux-musl
          - name: sh4
            tool: sh4-multilib-linux-musl
          - name: x86_64
            tool: x86_64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: true
      - name: Build ${{ matrix.name }}
        run: |
          sudo mkdir -p /opt/x-tools
          wget https://github.com/cross-tools/musl-cross/releases/download/20261001/${{ matrix.tool }}.tar.xz
          sudo tar xf ${{ matrix.tool }}.tar.xz -C /opt/x-tools
          make CROSS_PREFIX=/opt/x-tools/${{ matrix.tool }}/bin/${{ matrix.tool }}- CFLAGS=${{ matrix.env.CFLAGS }} ENABLE_STATIC=1 -j`nproc`

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: true
      - name: Build
        run: |
          make

  freebsd:
    name: FreeBSD
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: true
      - name: Build
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y gmake gcc
          run: |
            gmake

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: true
      - name: Prepare
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip android-ndk-r27d-linux.zip
          ln -sf . jni
      - name: Build
        run: |
          ./android-ndk-r27d/ndk-build

  llvm:
    name: LLVM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: true
      - name: Prepare
        run: |
          sudo apt install -y clang
      - name: Build
        run: |
          make CC=clang ENABLE_STATIC=1 -j`nproc`

  windows-msvc:
    name: Windows native MSVC x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: true
      - name: Compile native MSVC library
        shell: pwsh
        run: |
          & .\build-msvc.ps1 -Target lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Static check: every library member must be machine 8664.
      - name: Verify machine types
        shell: pwsh
        run: |
          & .\build-msvc.ps1 -Target verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-msvc-x86:
    name: Windows native MSVC x86
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: true
      - name: Compile native MSVC library
        shell: pwsh
        run: |
          & .\build-msvc.ps1 -Target lib -Arch x86
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Static check: every library member must be machine 14C.
      - name: Verify machine types
        shell: pwsh
        run: |
          & .\build-msvc.ps1 -Target verify -Arch x86
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-msvc-arm64:
    name: Windows native MSVC ARM64 (cross compile)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: true
      # Cross-compiles genuine native ARM64 (x64_arm64, not ARM64EC) from the
      # x64 runner.
      - name: Compile native MSVC library
        shell: pwsh
        run: |
          & .\build-msvc.ps1 -Target lib -Arch arm64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Static check: every library member must be machine AA64.
      - name: Verify machine types
        shell: pwsh
        run: |
          & .\build-msvc.ps1 -Target verify -Arch arm64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
